<header class="cabecalho">
  <div class="conteudo linha">
    <!-- Não é link: Tarefas já é o primeiro destino, e um segundo caminho para a mesma tela
         só acrescenta uma parada a mais para quem navega pelo teclado. -->
    <app-logo />

    <!-- A partir de 640px os destinos cabem na linha. Abaixo disso descem para a barra de
         abas, no pé da tela. -->
    <nav class="links" aria-label="Navegação principal">
      @for (rota of rotas; track rota.para) {
        <a [routerLink]="rota.para" routerLinkActive="ativo" ariaCurrentWhenActive="page">
          {{ rota.rotulo }}
        </a>
      }
    </nav>

    <!-- Um ícone só na ponta direita, em qualquer largura: nome, tema e saída moram no menu
         dele. Sair não é destino, e por isso não virou aba. -->
    <button
      type="button"
      class="botao-icone"
      [matMenuTriggerFor]="menuDaConta"
      #gatilho="matMenuTrigger"
      [class.aberto]="gatilho.menuOpen"
      [attr.aria-label]="gatilho.menuOpen ? 'Fechar menu da conta' : 'Abrir menu da conta'"
      title="Conta"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    </button>

    <mat-menu #menuDaConta="matMenu" class="menu-vidro" xPosition="before">
      <!-- O símbolo ao lado do nome: o menu abre por cima do conteúdo, e é o que o amarra
           de volta ao app. -->
      @if (usuario()) {
        <span class="dono">
          <app-simbolo tamanho="1rem" />
          <span class="nome-do-dono">{{ usuario() }}</span>
        </span>
      }

      <button mat-menu-item class="opcao" (click)="alternarTema($event)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          @if (paraEscuro()) {
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          } @else {
            <circle cx="12" cy="12" r="5" />
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
          }
        </svg>
        {{ paraEscuro() ? 'Tema escuro' : 'Tema claro' }}
      </button>

      <button mat-menu-item class="opcao" (click)="sair()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Sair
      </button>
    </mat-menu>
  </div>
</header>

<!-- O espaço de baixo, no celular, reserva a altura da barra fixa: sem ele, o último card
     ficaria para sempre por baixo das abas. -->
<main class="conteudo pagina">
  <router-outlet />
</main>

<!-- Solta das bordas, e não colada ao pé da tela: o conteúdo passa por baixo e em volta
     dela, que é o que dá ao vidro alguma coisa para desfocar. -->
<nav class="abas" aria-label="Navegação principal">
  <div class="vidro trilho-das-abas">
    <div class="abas-por-dentro">
      @if (indiceAtivo() >= 0) {
        <span
          class="trilho-da-bolha"
          aria-hidden="true"
          [style.width.%]="100 / rotas.length"
          [style.transform]="'translateX(' + indiceAtivo() * 100 + '%)'"
        >
          <span class="bolha"></span>
        </span>
      }
      @for (rota of rotas; track rota.para) {
        <a class="aba" [routerLink]="rota.para" routerLinkActive="ativa" ariaCurrentWhenActive="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            @for (traco of rota.icone; track $index) {
              <path [attr.d]="traco" />
            }
          </svg>
          {{ rota.rotulo }}
        </a>
      }
    </div>
  </div>
</nav>
