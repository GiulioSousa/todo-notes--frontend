name: CI

# Build, testes e conferencia das mensagens de commit.
#
# Sem banco e sem backend: os testes do frontend sao do Vitest sobre jsdom, e nenhum deles
# chama a rede - o HttpTestingController responde no lugar dela. O que este CI prova e que o
# projeto compila em producao e que a suite passa numa maquina que nao e a sua.
#
# AS VERSOES DAS ACTIONS NAO PODEM REGREDIR. checkout v7, setup-node v7 e gitleaks v3 sao os
# majors de runtime Node 24. A geracao v4 delas roda em Node 20, que o GitHub removeu dos
# runners em 16/09/2026: fixar uma versao anterior nao e ser conservador, e nao rodar.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  commits:
    name: Mensagens de commit
    runs-on: ubuntu-latest
    steps:
      # O historico inteiro: a conferencia le mensagens, nao arvores.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conferir a convencao
        env:
          ANTERIOR: ${{ github.event.before }}
          ZEROS: '0000000000000000000000000000000000000000'
        run: |
          set -euo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            # Pull request: so os commits que ele traz.
            git fetch --no-tags origin "$GITHUB_BASE_REF"
            .github/scripts/conferir-commits.sh "origin/$GITHUB_BASE_REF..HEAD"
          elif [ "$ANTERIOR" != "$ZEROS" ] && git cat-file -e "$ANTERIOR" 2>/dev/null; then
            # Push em main: so o que o push trouxe.
            .github/scripts/conferir-commits.sh "$ANTERIOR..$GITHUB_SHA"
          else
            # Primeiro push do repositorio: nao ha ponto anterior, entao confere tudo.
            .github/scripts/conferir-commits.sh
          fi

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    steps:
      # O historico inteiro: o gitleaks varre commit por commit, nao a arvore atual. Um
      # segredo que entrou e saiu num commit seguinte continua no historico, e e esse o caso
      # que mais importa pegar.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Primeiro a conferencia da convencao, que e barata. Aqui ela vale menos do que no
      # backend - o frontend nao guarda credencial nenhuma -, e esta pelo mesmo motivo que o
      # .gitignore daqui tem a secao de segredos: o dia em que alguem criar um .env na raiz,
      # a regra ja esta de pe.
      - name: Conferir a convencao do .gitignore
        run: .github/scripts/conferir-segredos.sh

      # Depois a varredura por conteudo, por padrao e por entropia. Os valores de teste
      # versionados de proposito estao permitidos por VALOR no .gitleaks.toml.
      #
      # A action e gratuita em repositorio de conta pessoal; o GITLEAKS_LICENSE so e exigido
      # de repositorio de organizacao.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  build:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar o Node
        uses: actions/setup-node@v7
        with:
          # A 24, e nao a 22, desde 2026-11-26. O Angular 22 pede `^22.22.3 || ^24.15.0 ||
          # >=26`, e o `node-version: '22'` do setup-node entrega a ultima 22.x do runner, que
          # pode estar abaixo da 22.22.3. O Angular 21, que esta no main hoje, aceita ^24 -
          # entao a 24 serve aos dois, e e por onde o PR do grupo precisa passar.
          node-version: '24'
          cache: npm

      # `npm ci` e nao `npm install`: instala exatamente o package-lock.json, e falha se ele
      # estiver fora de sincronia com o package.json - que e justamente o que se quer saber.
      - name: Instalar as dependencias
        run: npm ci

      - name: Testes
        run: npm test -- --watch=false

      # A configuracao de producao e a que tem os orcamentos de tamanho: 500kB de aviso e
      # 1MB de erro no bundle inicial. Compilar so em desenvolvimento esconderia isso.
      - name: Build de producao
        run: npm run build

      # O Dependabot sobe versao no package.json e nao sabe que ha um README falando delas.
      # Esta conferencia e o que impede a tabela de versoes de envelhecer em silencio.
      - name: Conferir o bloco de versoes do README
        run: node .github/scripts/versoes-readme.mjs --conferir

      # O `prettier --check` fica de fora de proposito: app.config.ts, main.ts e tarefas.html
      # divergem do formato desde antes de haver CI, e ligar a conferencia agora quebraria o
      # build por formatacao em vez de por codigo. Entra quando o repositorio estiver limpo.
