name: release-please

# Mantem aberto um PR de release e, no merge dele, cria a tag e a release.
#
# O que ele escreve, a partir das mensagens de commit: a versao no package.json e no
# package-lock.json, o CHANGELOG.md e o bloco de versao do README.md. Nada disso e editado a
# mao - a Secao 9 do ESPECIFICACOES.md diz que quem escreve a versao e o robo.
#
# A linha de versao deste repositorio e INDEPENDENTE da do backend: os dois sobem em ritmos
# proprios, e as tags `vX.Y.Z` nao levam nome de componente justamente porque cada
# repositorio tem a sua.
#
# Quem diz a primeira versao e o `initial-version: 0.1.0`, no release-please-config.json, e
# NAO o manifesto. Com `bootstrap-sha` e sem tag anterior, este e um *initial release*: o robo
# nao incrementa versao nenhuma, entao o `bump-minor-pre-major` nem chega a ser consultado -
# sem o `initial-version` ele usa o padrao dele, 1.0.0, que foi o que saiu no primeiro PR, em
# 2026-11-25. O manifesto fica em 0.0.0 so para o intervalo de commits comecar do inicio.

# O `pull-request-title-pattern` existe por causa do conferir-commits.sh. O padrao do robo e
# `chore${scope}: release${component} ${version}`, e o ${scope} vira o nome do ramo: o commit
# sai como `chore(main): release 0.1.0`. O `main` nao e bounded context, nao esta na lista de
# escopos, e o CI reprovou o primeiro merge de release por isso (2026-11-25). Sem escopo, o
# assunto passa -- e continua Conventional Commits.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: PR de release
    runs-on: ubuntu-latest
    steps:
      # Nota conhecida: com o GITHUB_TOKEN padrao, o PR aberto por esta action NAO dispara o
      # workflow de CI (o GitHub nao encadeia workflows a partir do token proprio). O PR de
      # release so muda versao e CHANGELOG, entao o risco e baixo; se um dia for preciso ver
      # o CI nele, troque por um PAT em secrets.
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
