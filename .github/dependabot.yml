version: 2

# Atualizacoes de dependencia e de actions, uma vez por semana.
#
# O `prefix: build` existe para o PR do Dependabot passar pelo conferir-commits.sh: sem ele a
# mensagem nasce fora da convencao e o CI do proprio robo reprova. Sem escopo de proposito -
# `deps` nao e bounded context, e a lista de escopos e de contexto, nao de ferramenta.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    # O Angular sobe em bloco: core, cli, build, material e cdk precisam andar na mesma
    # versao, e PRs separados para cada um nao compilariam sozinhos.
    #
    # O typescript e o vitest entram no mesmo bloco desde 2026-11-25, e nao por organizacao:
    # o @angular/build declara os dois como pares com faixa fechada, e cada versao do Angular
    # pede uma faixa diferente. O Angular 22 exige typescript >=6.0 <6.1 e aceita vitest 4 ou
    # 5; o 21 exige <6.0 e so aceita o vitest 4. Separados, os tres PRs ficam vermelhos ao
    # mesmo tempo e nenhum deles passa sozinho -- foi o que aconteceu com os de 2026-11-24,
    # descritos no execucao.md.

    # O agrupamento nao basta sozinho: ele junta os pacotes num PR so, mas pega sempre a
    # ultima versao de cada um, e nao um conjunto que se encaixe. Em 2026-11-26 o grupo veio
    # com typescript 7.0.2 e o `npm ci` reprovou, porque o @angular/compiler-cli 22 e o
    # @angular/build 22 pedem `>=6.0 <6.1` -- conferido no registro do npm, nao de memoria.
    #
    # Entao o typescript para na faixa que o Angular aceita. NAO e trava permanente: no dia
    # em que o Angular suportar a 7, esta regra sai, e e o PR vermelho do grupo que vai
    # avisar. O vitest nao precisa de regra: o @angular/build 22 aceita `^4.0.8 || ^5.0.0`.
    ignore:
      - dependency-name: 'typescript'
        versions:
          - '>= 7'

    groups:
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'typescript'
          - 'vitest'
      rotina:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'typescript'
          - 'vitest'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
